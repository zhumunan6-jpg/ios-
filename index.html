<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="description" content="一个简单的中文多音频播放器 PWA" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/app-icon.svg" />
    <link rel="stylesheet" href="./assets/audioPlayer.css" />
    <title>中文音频播放器</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">Audio Library</p>
        <h1>中文音频播放器</h1>
        <p class="subtitle">按分类整理你的声音空间</p>
      </header>

      <section class="player-container" aria-labelledby="player-title">
        <div class="category-section">
          <div class="section-heading">
            <div>
              <p class="section-kicker">音频分类</p>
              <h2 id="categoryTitle">工作音乐</h2>
            </div>
            <div class="section-heading-actions">
              <span id="trackCount" class="track-count">0 个内容</span>
              <button id="importButton" class="import-button" type="button">本机上传</button>
            </div>
          </div>
          <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="音频分类"></div>
        </div>

        <div class="track-summary">
          <span class="track-label">正在播放</span>
          <h2 id="player-title">暂无音频</h2>
          <p id="statusMessage" class="status-message" role="status" aria-live="polite">
            点击“播放”开始
          </p>
        </div>

        <audio id="audioPlayer" preload="metadata">
          你的浏览器不支持 HTML5 音频播放。
        </audio>
        <input id="fileInput" type="file" accept="audio/*" multiple hidden />

        <div class="controlBar" aria-label="音频播放控制">
          <button id="previousButton" class="control-button secondary" type="button" aria-label="上一首">
            上一首
          </button>
          <button id="playButton" class="control-button primary" type="button" aria-pressed="false">
            播放
          </button>
          <button id="nextButton" class="control-button secondary" type="button" aria-label="下一首">
            下一首
          </button>
        </div>

        <button id="playModeButton" class="mode-button" type="button" aria-pressed="false">
          <span class="mode-icon" aria-hidden="true">↗</span>
          <span>顺序播放</span>
        </button>

        <div class="progress-section">
          <label for="progressRail" class="sr-only">播放进度</label>
          <input id="progressRail" class="range-input" type="range" min="0" max="0" value="0" step="0.1" />
          <div class="time-row" aria-hidden="true">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
          </div>
        </div>

        <div class="volume-section">
          <button id="muteButton" class="text-button" type="button" aria-pressed="false">静音</button>
          <label for="volumeRail" class="sr-only">音量</label>
          <input id="volumeRail" class="range-input" type="range" min="0" max="1" value="1" step="0.05" />
        </div>

        <div class="playlist-section">
          <div class="playlist-heading">
            <div class="playlist-heading-main">
              <button id="backButton" class="back-button" type="button" hidden>
                <span aria-hidden="true">←</span>
                返回分类
              </button>
              <div>
                <p id="playlistKicker" class="section-kicker">内容列表</p>
                <h3 id="playlistTitle">工作音乐</h3>
              </div>
            </div>
            <span id="playlistHint" class="playlist-hint">单曲和歌单</span>
          </div>
          <ol id="playlist" class="playlist" aria-label="音频列表"></ol>
        </div>
      </section>

      <footer class="app-footer">
        <p>音频仅保存在本机。清除网站数据可能导致音频丢失。</p>
      </footer>
    </main>

    <div id="libraryModal" class="modal-backdrop" hidden>
      <section class="library-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-heading">
          <div>
            <p class="section-kicker">本机音频库</p>
            <h2 id="modalTitle">导入本机音频</h2>
          </div>
          <button id="modalCloseButton" class="modal-close-button" type="button" aria-label="关闭">×</button>
        </div>

        <p id="modalFileSummary" class="modal-file-summary"></p>

        <label class="modal-field">
          <span>一级分类</span>
          <select id="modalCategorySelect"></select>
        </label>

        <label class="modal-field">
          <span id="modalDestinationLabel">音频去向</span>
          <select id="modalDestinationSelect">
            <option value="category">直接进入一级分类</option>
            <option value="new-playlist">新建二级歌单</option>
            <option value="playlist">进入已有二级歌单</option>
          </select>
        </label>

        <label id="newPlaylistField" class="modal-field" hidden>
          <span>新歌单名称</span>
          <input id="newPlaylistName" type="text" maxlength="80" placeholder="例如：晨间专注" />
        </label>

        <label id="existingPlaylistField" class="modal-field" hidden>
          <span>已有歌单</span>
          <select id="existingPlaylistSelect"></select>
        </label>

        <p id="modalHint" class="modal-hint">本次选择的音频会进入同一个目标。</p>
        <div class="modal-actions">
          <button id="modalCancelButton" class="control-button secondary" type="button">取消</button>
          <button id="modalConfirmButton" class="control-button primary" type="button">确认导入</button>
        </div>
      </section>
    </div>

    <script type="module" src="./assets/audioPlaylist.js"></script>
  </body>
</html>
